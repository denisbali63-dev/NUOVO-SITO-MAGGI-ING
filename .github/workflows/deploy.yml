name: Deploy sito su GitHub Pages

# Builda il sito "studio-ingegneria-maggi" e lo pubblica su GitHub Pages
# a ogni push sul branch main (o manualmente da Actions -> Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi necessari per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploy sovrapposti
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile

      - name: Build del sito
        env:
          # Su GitHub Pages "di progetto" il sito vive in /<nome-repo>/.
          # BASE_PATH viene calcolato in automatico dal nome del repository.
          PORT: "4173"
          BASE_PATH: "/${{ github.event.repository.name }}/"
        run: pnpm --filter @workspace/studio-ingegneria-maggi run build

      - name: Fallback SPA (404 -> index)
        run: cp artifacts/studio-ingegneria-maggi/dist/public/index.html artifacts/studio-ingegneria-maggi/dist/public/404.html

      - name: Prepara artifact per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/studio-ingegneria-maggi/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
